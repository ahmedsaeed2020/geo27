<!-- ===== HTML widget at [0, 0] ===== -->

<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&amp;family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet"/>
<style>
  :root{ --deep:#064E3B; --deep2:#08140F; --emer:#0A8754; --mint:#34D399; --ink:#0B1F17; --bg:#F4F3EE; --paper:#FBFBF9; --line:rgba(6,78,59,.12); --muted:rgba(11,31,23,.62); --grey:#5B6B63; --soft:#EBEFEC; --shadow:0 1px 0 rgba(6,78,59,.04), 0 16px 44px rgba(6,78,59,.08); }
  *{ box-sizing:border-box; } html,body{ margin:0; padding:0; scroll-behavior:smooth; }
  body{ background:var(--bg); font-family:'IBM Plex Sans Arabic',sans-serif; color:var(--ink); -webkit-font-smoothing:antialiased; line-height:1.7; }
  .mono{ font-family:'Space Mono',monospace; } .num{ font-variant-numeric:tabular-nums; }
  .wrap{ max-width:1180px; margin:0 auto; padding:0 28px; }
  a{ color:inherit; text-decoration:none; }
  .eyebrow{ font-family:'Space Mono',monospace; font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--emer); }
  h2.sec{ font-family:'Archivo',sans-serif; font-weight:800; font-size:34px; letter-spacing:-.025em; margin:10px 0 10px; line-height:1.15; }
  .lede{ font-size:16.5px; color:var(--muted); max-width:680px; margin:0 auto; line-height:1.8; }
  .center{ text-align:center; }
  .btn{ display:inline-flex; align-items:center; gap:8px; font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; padding:14px 26px; border-radius:12px; transition:.15s; cursor:pointer; border:none; }
  .btn.solid{ background:var(--emer); color:#fff; } .btn.solid:hover{ background:var(--deep); }
  .btn.mint{ background:var(--mint); color:var(--ink); } .btn.mint:hover{ background:#54e0a8; }
  .btn.ghost{ background:transparent; color:#fff; border:1.5px solid rgba(244,243,238,.35); } .btn.ghost:hover{ border-color:var(--mint); }
  .btn.ghostd{ background:transparent; color:var(--deep); border:1.5px solid var(--line); } .btn.ghostd:hover{ border-color:var(--emer); }
  .btn.sm{ padding:9px 16px; font-size:13.5px; border-radius:9px; }

  header.nav{ position:sticky; top:0; z-index:60; background:rgba(244,243,238,.86); backdrop-filter:blur(12px); border-bottom:1px solid var(--line); }
  header.nav .in{ max-width:1180px; margin:0 auto; padding:14px 28px; display:flex; align-items:center; gap:24px; }
  .logo{ display:flex; align-items:center; gap:11px; direction:ltr; } .logo svg{ width:30px; height:30px; } .logo .w{ font-family:'Archivo',sans-serif; font-weight:800; font-size:19px; letter-spacing:-.03em; }
  nav.menu{ display:flex; gap:22px; margin-inline-start:8px; } nav.menu a{ font-size:14px; font-weight:600; color:rgba(11,31,23,.72); } nav.menu a:hover{ color:var(--deep); }
  header.nav .act{ margin-inline-start:auto; display:flex; gap:10px; align-items:center; }

  /* ===== HERO ===== */
  .hero{ position:relative; background:radial-gradient(120% 130% at 78% -10%, #0a5a44 0%, var(--deep) 42%, var(--deep2) 100%); color:var(--bg); padding:72px 0 88px; overflow:hidden; }
  .hero::before{ content:""; position:absolute; inset:0; background-image:linear-gradient(rgba(52,211,153,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(52,211,153,.05) 1px,transparent 1px); background-size:46px 46px; mask-image:radial-gradient(80% 80% at 70% 20%,#000,transparent 75%); }
  .hero .grid{ position:relative; display:grid; grid-template-columns:1fr 1.12fr; gap:46px; align-items:center; }
  .hero h1{ font-family:'Archivo',sans-serif; font-weight:900; font-size:50px; line-height:1.1; letter-spacing:-.03em; margin:14px 0 18px; }
  .hero p{ font-size:18px; color:rgba(244,243,238,.82); line-height:1.85; margin:0 0 28px; max-width:520px; }
  .hero .ctas{ display:flex; gap:12px; flex-wrap:wrap; }
  .hero .trust{ margin-top:26px; display:flex; gap:18px; flex-wrap:wrap; }
  .hero .trust span{ font-size:13px; color:rgba(244,243,238,.7); display:flex; align-items:center; gap:7px; } .hero .trust span::before{ content:""; width:7px; height:7px; border-radius:50%; background:var(--mint); }

  /* big dashboard */
  .stage{ position:relative; }
  .browser{ border-radius:18px; overflow:hidden; box-shadow:0 40px 90px rgba(0,0,0,.5); border:1px solid rgba(52,211,153,.18); background:#0c241b; transform:perspective(1600px) rotateY(-6deg) rotateX(2deg); }
  .bbar{ background:#0a1f17; padding:12px 15px; display:flex; align-items:center; gap:7px; }
  .bbar i{ width:11px; height:11px; border-radius:50%; background:rgba(244,243,238,.18); } .bbar .u{ margin-inline-start:14px; flex:1; background:rgba(244,243,238,.08); border-radius:7px; font-family:'Space Mono',monospace; font-size:10px; color:rgba(244,243,238,.5); padding:6px 12px; text-align:center; }
  .dash{ display:flex; min-height:360px; }
  .rail{ width:58px; background:#0a1f17; display:flex; flex-direction:column; align-items:center; gap:10px; padding:16px 0; }
  .rail .i{ width:30px; height:30px; border-radius:9px; background:rgba(244,243,238,.07); } .rail .i.on{ background:var(--mint); }
  .dmain{ flex:1; padding:18px; background:linear-gradient(180deg,#0e2a20,#0c241b); }
  .dtop{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; } .dtop .t{ font-family:'Archivo',sans-serif; font-weight:800; font-size:15px; color:#fff; } .dtop .p{ font-family:'Space Mono',monospace; font-size:9px; color:var(--mint); background:rgba(52,211,153,.14); border-radius:999px; padding:4px 10px; }
  .kpis{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:12px; }
  .kpi{ background:rgba(244,243,238,.05); border:1px solid rgba(244,243,238,.1); border-radius:12px; padding:12px; } .kpi .l{ font-size:9.5px; color:rgba(244,243,238,.55); } .kpi .v{ font-family:'Archivo',sans-serif; font-weight:800; font-size:18px; color:#fff; margin:3px 0; } .kpi .d{ font-family:'Space Mono',monospace; font-size:9px; color:var(--mint); }
  .drow2{ display:grid; grid-template-columns:1.4fr 1fr; gap:10px; }
  .chart{ display:flex; align-items:flex-end; gap:7px; height:120px; background:rgba(244,243,238,.04); border:1px solid rgba(244,243,238,.1); border-radius:12px; padding:14px; }
  .chart .bar{ flex:1; background:linear-gradient(180deg,var(--mint),var(--emer)); border-radius:4px 4px 0 0; }
  .side{ background:rgba(244,243,238,.04); border:1px solid rgba(244,243,238,.1); border-radius:12px; padding:12px; }
  .side .sr{ display:flex; justify-content:space-between; font-size:10px; color:rgba(244,243,238,.7); padding:6px 0; border-bottom:1px solid rgba(244,243,238,.07); } .side .sr .n{ font-family:'Space Mono',monospace; color:var(--mint); }
  /* floating cards */
  .fcard{ position:absolute; background:rgba(12,36,27,.85); backdrop-filter:blur(8px); border:1px solid rgba(52,211,153,.25); border-radius:13px; padding:11px 14px; box-shadow:0 18px 40px rgba(0,0,0,.4); }
  .fcard .l{ font-size:9px; color:rgba(244,243,238,.6); } .fcard .v{ font-family:'Archivo',sans-serif; font-weight:800; font-size:16px; color:#fff; } .fcard .d{ font-family:'Space Mono',monospace; font-size:9px; color:var(--mint); }
  .fcard.f1{ top:-22px; inset-inline-end:-18px; } .fcard.f2{ bottom:40px; inset-inline-start:-28px; }
  .sq{ position:absolute; border-radius:5px; background:var(--mint); }
  .sq.a{ width:14px; height:14px; top:30px; inset-inline-start:-10px; opacity:.7; } .sq.b{ width:10px; height:22px; bottom:-12px; inset-inline-end:90px; opacity:.5; border-radius:6px; }

  /* trust strip */
  .trustbar{ background:#053a2c; color:var(--bg); border-top:1px solid rgba(52,211,153,.15); }
  .trustbar .in{ max-width:1180px; margin:0 auto; padding:18px 28px; display:grid; grid-template-columns:repeat(6,1fr); gap:14px; }
  .tpill{ display:flex; flex-direction:column; align-items:center; gap:7px; text-align:center; } .tpill .ic{ width:40px; height:40px; border-radius:11px; background:rgba(52,211,153,.12); display:flex; align-items:center; justify-content:center; } .tpill .ic svg{ width:22px; height:22px; } .tpill span{ font-size:11.5px; color:rgba(244,243,238,.82); line-height:1.4; }

  section.blk{ padding:78px 0; } section.blk.alt{ background:var(--paper); }
  section.dark{ padding:78px 0; background:radial-gradient(100% 120% at 80% 0%, #0a5a44, var(--deep) 55%, var(--deep2)); color:var(--bg); position:relative; overflow:hidden; }

  /* problem chaos→control */
  .chaos{ display:grid; grid-template-columns:1fr auto 1fr; gap:24px; align-items:center; margin-top:40px; }
  .chaoscol{ display:flex; flex-direction:column; gap:10px; }
  .scrap{ background:#fff; border:1px solid var(--line); border-radius:11px; padding:13px 15px; font-size:13px; color:var(--muted); box-shadow:var(--shadow); display:flex; align-items:center; gap:9px; transform:rotate(-1.5deg); }
  .scrap:nth-child(even){ transform:rotate(1.5deg); } .scrap .x{ width:8px; height:8px; border-radius:50%; background:#C0492B; flex:none; }
  .arrowc{ display:flex; flex-direction:column; align-items:center; gap:8px; color:var(--emer); } .arrowc .a{ font-size:30px; } .arrowc .t{ font-family:'Space Mono',monospace; font-size:10px; }
  .unified{ background:var(--deep); border-radius:16px; padding:22px; color:#fff; box-shadow:0 20px 50px rgba(6,78,59,.25); }
  .unified .uh{ font-family:'Archivo',sans-serif; font-weight:800; font-size:15px; margin-bottom:12px; }
  .unified .urow{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px solid rgba(244,243,238,.1); font-size:12px; color:rgba(244,243,238,.82); } .unified .urow .n{ font-family:'Space Mono',monospace; color:var(--mint); }

  /* platform hub */
  .hub2{ position:relative; height:420px; margin-top:30px; }
  .hubcore{ position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); width:140px; height:140px; border-radius:24px; background:var(--deep); color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; box-shadow:0 0 0 10px rgba(10,135,84,.12), 0 24px 60px rgba(6,78,59,.3); z-index:3; }
  .hubcore .w{ font-family:'Archivo',sans-serif; font-weight:900; font-size:20px; } .hubcore .s{ font-size:10px; color:var(--mint); }
  .node{ position:absolute; background:#fff; border:1px solid var(--line); border-radius:13px; padding:11px 15px; font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; color:var(--deep); box-shadow:var(--shadow); z-index:2; white-space:nowrap; }
  .hubline{ position:absolute; inset:0; z-index:1; pointer-events:none; }

  /* module cards rich */
  .mods{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:38px; }
  .mod{ background:#fff; border:1px solid var(--line); border-radius:16px; padding:22px; box-shadow:var(--shadow); transition:.16s; display:block; }
  .mod:hover{ transform:translateY(-4px); box-shadow:0 22px 50px rgba(6,78,59,.14); }
  .mod .ic{ width:46px; height:46px; border-radius:12px; background:rgba(10,135,84,.1); display:flex; align-items:center; justify-content:center; margin-bottom:13px; } .mod .ic svg{ width:26px; height:26px; }
  .mod h4{ font-family:'Archivo',sans-serif; font-weight:800; font-size:16px; margin:0 0 5px; } .mod p{ font-size:13px; color:var(--muted); margin:0 0 12px; line-height:1.6; }
  .mod .snip{ height:42px; border-radius:8px; background:linear-gradient(110deg,var(--soft),#fff); border:1px solid var(--line); display:flex; align-items:center; gap:5px; padding:0 10px; }
  .mod .snip i{ height:6px; border-radius:3px; background:var(--mint); display:block; } .mod .go{ font-family:'Space Mono',monospace; font-size:10px; color:var(--emer); margin-top:11px; display:inline-block; }

  /* capability layers */
  .layers{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:38px; }
  .lay{ background:rgba(244,243,238,.06); border:1px solid rgba(244,243,238,.14); border-radius:14px; padding:20px; backdrop-filter:blur(4px); }
  .lay .ic{ width:42px; height:42px; border-radius:11px; background:rgba(52,211,153,.14); display:flex; align-items:center; justify-content:center; margin-bottom:12px; } .lay .ic svg{ width:24px; height:24px; }
  .lay h4{ font-family:'Archivo',sans-serif; font-weight:800; font-size:15px; margin:0 0 5px; color:#fff; } .lay p{ font-size:12.5px; color:rgba(244,243,238,.66); margin:0; line-height:1.6; }

  /* industries */
  .inds{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-top:38px; }
  .ind{ background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px; box-shadow:var(--shadow); transition:.16s; } .ind:hover{ transform:translateY(-3px); box-shadow:0 18px 44px rgba(6,78,59,.13); }
  .ind .ic{ width:40px; height:40px; border-radius:11px; background:rgba(10,135,84,.1); display:flex; align-items:center; justify-content:center; margin-bottom:11px; } .ind .ic svg{ width:23px; height:23px; }
  .ind h4{ font-family:'Archivo',sans-serif; font-weight:800; font-size:14.5px; margin:0 0 4px; } .ind p{ font-size:12px; color:var(--muted); margin:0; line-height:1.55; }

  /* POS feature hero */
  .posg{ display:grid; grid-template-columns:1fr 1fr; gap:46px; align-items:center; position:relative; z-index:2; }
  .posg h2{ color:#fff; } .posg .sub{ color:rgba(244,243,238,.82); font-size:16px; margin:6px 0 18px; }
  .posfeat{ display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-bottom:18px; } .posfeat div{ font-size:13.5px; color:rgba(244,243,238,.9); padding-inline-start:22px; position:relative; } .posfeat div::before{ content:"▪"; position:absolute; inset-inline-start:0; color:var(--mint); }
  .postags{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:18px; } .postags span{ font-size:11.5px; color:rgba(244,243,238,.8); background:rgba(52,211,153,.1); border:1px solid rgba(52,211,153,.22); border-radius:999px; padding:5px 12px; }
  .posprice{ font-family:'Archivo',sans-serif; font-weight:700; font-size:15px; color:var(--mint); margin-bottom:20px; }
  .posmock{ background:#0c241b; border:1px solid rgba(52,211,153,.18); border-radius:18px; padding:16px; box-shadow:0 30px 70px rgba(0,0,0,.45); }
  .posmock .ph{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; } .posmock .ph .t{ font-family:'Archivo',sans-serif; font-weight:800; font-size:13px; color:#fff; } .posmock .ph .s{ font-family:'Space Mono',monospace; font-size:9px; color:var(--mint); }
  .posmock .row{ display:flex; justify-content:space-between; padding:10px 12px; border-radius:9px; font-size:12px; color:rgba(244,243,238,.85); } .posmock .row:nth-child(odd){ background:rgba(244,243,238,.05); } .posmock .row .am{ font-family:'Space Mono',monospace; color:var(--mint); font-weight:700; }
  .posmock .total{ margin-top:10px; background:var(--mint); color:var(--ink); border-radius:9px; padding:12px 14px; display:flex; justify-content:space-between; font-family:'Archivo',sans-serif; font-weight:800; }

  /* pricing */
  .price3{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-top:38px; align-items:start; }
  .ptier{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:28px 24px; box-shadow:var(--shadow); display:flex; flex-direction:column; }
  .ptier.feat{ box-shadow:0 0 0 2px var(--emer), 0 20px 50px rgba(6,78,59,.16); transform:translateY(-6px); }
  .ptier .fl{ font-family:'Space Mono',monospace; font-size:10px; color:#fff; background:var(--emer); border-radius:999px; padding:4px 11px; align-self:flex-start; margin-bottom:10px; }
  .ptier .nm{ font-family:'Archivo',sans-serif; font-weight:800; font-size:20px; color:var(--deep); } .ptier .d{ font-size:13px; color:var(--muted); margin:6px 0 16px; min-height:40px; line-height:1.55; }
  .ptier .pr{ font-family:'Archivo',sans-serif; font-weight:900; font-size:26px; color:var(--ink); letter-spacing:-.02em; } .ptier .pru{ font-size:12px; color:var(--grey); margin:4px 0 18px; }
  .ptier .btn{ margin-top:auto; justify-content:center; }
  .pnote{ text-align:center; font-size:12.5px; color:#8a6d1f; background:#FBF6E9; border-radius:10px; padding:11px; margin-top:18px; }

  /* timeline */
  .tl{ display:flex; gap:0; margin-top:44px; }
  .tl .ph{ flex:1; text-align:center; position:relative; padding-top:40px; }
  .tl .ph::before{ content:""; position:absolute; top:18px; inset-inline:0; height:2px; background:var(--line); }
  .tl .ph:first-child::before{ inset-inline-start:50%; } .tl .ph:last-child::before{ inset-inline-end:50%; }
  .tl .ph .dot{ position:absolute; top:8px; inset-inline-start:calc(50% - 11px); width:22px; height:22px; border-radius:7px; background:var(--emer); color:#fff; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  .tl .ph .nm{ font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; }

  /* faq */
  .faqg{ display:grid; grid-template-columns:1.6fr 1fr; gap:24px; margin-top:38px; align-items:start; }
  .qa{ background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .qa summary{ padding:16px 18px; font-family:'Archivo',sans-serif; font-weight:700; font-size:14.5px; color:var(--deep); cursor:pointer; list-style:none; display:flex; justify-content:space-between; align-items:center; }
  .qa summary::-webkit-details-marker{ display:none; } .qa summary::after{ content:"+"; color:var(--emer); font-weight:800; font-size:20px; } .qa[open] summary::after{ content:"−"; }
  .qa .a{ padding:0 18px 16px; font-size:13.5px; color:var(--muted); line-height:1.7; }
  .faqcta{ background:var(--deep); color:#fff; border-radius:16px; padding:26px; box-shadow:0 18px 44px rgba(6,78,59,.2); }
  .faqcta h4{ font-family:'Archivo',sans-serif; font-weight:800; font-size:17px; margin:0 0 8px; } .faqcta p{ font-size:13px; color:rgba(244,243,238,.78); margin:0 0 16px; line-height:1.6; }

  /* final */
  .final{ text-align:center; position:relative; z-index:2; } .final h2{ color:#fff; font-size:40px; } .final p{ color:rgba(244,243,238,.82); font-size:17px; max-width:520px; margin:12px auto 28px; } .final .ctas{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; } .final .proof{ margin-top:22px; font-size:13px; color:rgba(244,243,238,.6); }

  footer{ background:var(--ink); color:rgba(244,243,238,.6); padding:50px 0 30px; }
  footer .top{ display:grid; grid-template-columns:1.4fr 1fr 1fr 1fr; gap:30px; padding-bottom:30px; border-bottom:1px solid rgba(244,243,238,.1); }
  footer .col h5{ font-family:'Archivo',sans-serif; font-weight:700; font-size:13px; color:#fff; margin:0 0 12px; } footer .col a{ display:block; font-size:13px; color:rgba(244,243,238,.6); padding:5px 0; } footer .col a:hover{ color:var(--mint); }
  footer .bm{ font-size:14px; color:rgba(244,243,238,.72); line-height:1.7; max-width:280px; } footer .bot{ display:flex; justify-content:space-between; flex-wrap:wrap; gap:14px; padding-top:20px; font-size:12px; } footer .mono{ font-family:'Space Mono',monospace; opacity:.6; }

  .imgnote{ font-family:'Space Mono',monospace; font-size:10px; color:var(--grey); text-align:center; margin-top:12px; opacity:.6; }

  @media (max-width:980px){
    .hero .grid,.chaos,.posg,.faqg{ grid-template-columns:1fr; } .hero h1{ font-size:36px; } .browser{ transform:none; }
    .trustbar .in{ grid-template-columns:repeat(3,1fr); } .mods,.price3{ grid-template-columns:1fr 1fr; } .inds{ grid-template-columns:1fr 1fr; } .layers{ grid-template-columns:1fr; }
    .hub2{ display:none; } nav.menu{ display:none; } footer .top{ grid-template-columns:1fr 1fr; } h2.sec{ font-size:27px; } .chaos{ gap:14px; } .arrowc .a{ transform:rotate(90deg); }
  }
  @media (max-width:560px){ .mods,.price3,.inds,.trustbar .in{ grid-template-columns:1fr; } .tl{ flex-direction:column; gap:14px; } .tl .ph::before{ display:none; } }
</style>
